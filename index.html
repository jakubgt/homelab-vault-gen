<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab Vault Generator</title>
    <style>
        /* Light Mode Colors (Now the Default) */
        :root {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --input-bg: #eeeeee;
            --border-color: #cccccc;
        }
        /* Dark Mode Colors */
        body.dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --input-bg: #2d2d2d;
            --border-color: #444;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }
        body.dark-mode .container {
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        /* Theme Toggle Button */
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 22px;
        }
        #result {
            background-color: var(--input-bg);
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 18px;
            word-wrap: break-word;
            min-height: 22px;
        }
        .controls {
            margin-bottom: 20px;
            text-align: left;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .time-inputs {
            display: flex;
            gap: 10px;
        }
        select, input[type="number"] {
            padding: 6px;
            border-radius: 5px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 10px;
        }
        button.action-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }
        button.action-btn:hover { background-color: #0056b3; }
        #copy-btn { background-color: #28a745; }
        #copy-btn:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="theme-btn" title="Toggle Theme">🌙</button>
        <h2>Secure Generator</h2>
        <div id="result"></div>
        
        <div class="controls">
            <label>Length: <span id="length-val">24</span></label>
            <input type="range" id="length" min="12" max="64" value="20">
        </div>

        <div class="setting-row">
            <label for="clear-time">Auto-Clear Clipboard:</label>
            <div class="time-inputs">
                <input type="number" id="custom-time" min="1" placeholder="Secs" style="display: none; width: 60px;">
                <select id="clear-time">
                    <option value="30000">30 Seconds</option>
                    <option value="60000" selected>60 Seconds</option>
                    <option value="300000">5 Minutes</option>
                    <option value="custom">Custom...</option>
                </select>
            </div>
        </div>

        <button class="action-btn" id="generate-btn">Generate Password</button>
        <button class="action-btn" id="copy-btn">Copy Password</button>
    </div>

    <script>
        const resultEl = document.getElementById('result');
        const lengthEl = document.getElementById('length');
        const lengthVal = document.getElementById('length-val');
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const themeBtn = document.getElementById('theme-btn');
        const clearTimeSelect = document.getElementById('clear-time');
        const customTimeInput = document.getElementById('custom-time');

        // Character Pool (Excludes shell-breaking quotes/backticks)
        const CHARS = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+[]{};:,.<>/?|~"; 

        // Update length text when sliding
        lengthEl.addEventListener('input', () => {
            lengthVal.innerText = lengthEl.value;
        });

        // Theme Toggle Logic
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeBtn.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        });

        // Show/Hide Custom Time Input
        clearTimeSelect.addEventListener('change', () => {
            if (clearTimeSelect.value === 'custom') {
                customTimeInput.style.display = 'block';
                customTimeInput.focus();
            } else {
                customTimeInput.style.display = 'none';
            }
        });

        // Generate Crypto-Secure Password
        function generatePassword() {
            const length = +lengthEl.value;
            let password = "";
            const randomValues = new Uint32Array(length);
            window.crypto.getRandomValues(randomValues);

            for (let i = 0; i < length; i++) {
                password += CHARS[randomValues[i] % CHARS.length];
            }
            resultEl.innerText = password;
            copyBtn.innerText = "Copy Password"; 
        }

        // Copy with selectable/custom Auto-Clear
        let clearTimer;
        copyBtn.addEventListener('click', () => {
            const pwd = resultEl.innerText;
            if (!pwd) return;

            let delay;
            let timeLabel;

            // Handle custom time logic
            if (clearTimeSelect.value === 'custom') {
                const customSecs = parseInt(customTimeInput.value, 10);
                if (isNaN(customSecs) || customSecs <= 0) {
                    alert("Please enter a valid number of seconds.");
                    return;
                }
                delay = customSecs * 1000;
                timeLabel = `${customSecs}s`;
            } else {
                delay = parseInt(clearTimeSelect.value, 10);
                timeLabel = delay === 30000 ? "30s" : delay === 60000 ? "60s" : "5m";
            }

            navigator.clipboard.writeText(pwd).then(() => {
                copyBtn.innerText = `Copied! (Clears in ${timeLabel})`;
                clearTimeout(clearTimer);
                
                clearTimer = setTimeout(() => {
                    navigator.clipboard.writeText("");
                    copyBtn.innerText = "Copy Password";
                }, delay);
            });
        });

        // Generate a password as soon as the page loads
        generatePassword();
        generateBtn.addEventListener('click', generatePassword);
    </script>
</body>
</html>
