services:
  vault-gen:
    image: "${VAULT_IMAGE:-nginxinc/nginx-unprivileged:1.30.4-alpine}"
    init: true
    ports:
      - "${VAULT_BIND_ADDRESS:-127.0.0.1}:${VAULT_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./core.js:/usr/share/nginx/html/core.js:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./words.js:/usr/share/nginx/html/words.js:ro
      - ./qrcode.min.js:/usr/share/nginx/html/qrcode.min.js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
