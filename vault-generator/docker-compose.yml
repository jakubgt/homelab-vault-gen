services:
  vault-gen:
    image: nginx:alpine
    container_name: vault-gen
    network_mode: host # Explicitly shares host network for unprivileged LXC/Proxmox compatibility
    read_only: true # Hardens security by preventing changes to the container filesystem
    tmpfs:
      - /var/cache/nginx:mode=777
      - /var/run:mode=777
      - /tmp:mode=777
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
