services:
  vault-gen:
    # To pin by digest for reproducible/tamper-evident builds, run:
    #   docker pull nginxinc/nginx-unprivileged:alpine
    #   docker inspect --format='{{index .RepoDigests 0}}' nginxinc/nginx-unprivileged:alpine
    # then replace the tag below with the resulting nginxinc/nginx-unprivileged@sha256:...
    image: nginxinc/nginx-unprivileged:alpine
    container_name: vault-gen
    network_mode: host 
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:mode=777
      - /var/run:mode=777
      - /tmp:mode=777
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./words.js:/usr/share/nginx/html/words.js:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 1m
      timeout: 10s
    restart: unless-stopped
