<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <title>Homelab Vault Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="theme-btn">🌙</button>
        <h2>Secure Generator</h2>
        
        <div id="result-container" class="copy-box">
            <div id="result"></div>
            <div id="paranoid-overlay" class="hidden">Hover to Reveal</div>
        </div>
        
        <div class="entropy-meter">
            <span id="entropy-text">Entropy: 0 bits</span>
            <div class="entropy-bar-container"><div id="entropy-bar"></div></div>
        </div>

        <div class="tabs">
            <button id="tab-pwd" class="tab-btn active">Password</button>
            <button id="tab-pass" class="tab-btn">Passphrase</button>
        </div>

        <div class="controls">
            <label><span id="length-label">Length</span>: <span id="length-val">20</span></label>
            <input type="range" id="length" min="4" max="128" value="20">

            <div id="pwd-options" class="options-grid">
                <label><input type="checkbox" id="opt-upper" checked> Uppercase</label>
                <label><input type="checkbox" id="opt-lower" checked> Lowercase</label>
                <label><input type="checkbox" id="opt-nums" checked> Numbers</label>
                <label><input type="checkbox" id="opt-syms" checked> Symbols</label>
            </div>

            <div id="pass-options" class="options-grid hidden">
                <label><input type="checkbox" id="opt-pass-caps"> Capitalize</label>
                <label><input type="checkbox" id="opt-pass-nums"> Numbers</label>
                <label>Sep: <select id="opt-pass-sep"><option value="-">-</option><option value=".">.</option></select></label>
            </div>

            <div class="setting-row">
                <label><input type="checkbox" id="opt-paranoid"> <strong>Paranoid Mode</strong></label>
            </div>
        </div>

        <button class="action-btn" id="generate-btn">Generate</button>
        <button class="action-btn" id="copy-btn">Copy</button>
    </div>

    <div id="toast"></div>

    <script src="words.js"></script>
    <script src="app.js"></script>
</body>
</html>
