<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Homelab Vault Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="theme-btn" title="Toggle Theme">🌙</button>
        <h2>Secure Generator</h2>
        
        <div class="tabs">
            <button id="tab-pwd" class="tab-btn active">Password</button>
            <button id="tab-pass" class="tab-btn">Passphrase</button>
            <button id="tab-user" class="tab-btn">Username</button>
        </div>
        
        <div id="result-container" title="Click to copy">
            <div id="result"></div>
            <div id="paranoid-overlay" class="hidden">Hover to Reveal</div>
        </div>
        
        <div class="stats-row">
            <span id="entropy-text">Entropy: 0 bits</span>
            <span id="strength-text" class="strength-weak">Strength: Weak</span>
        </div>
        <div class="entropy-bar-container">
            <div id="entropy-bar"></div>
        </div>
        <div class="crack-estimation">
            <span id="crack-text">Estimated Time to Crack: Instant</span>
        </div>

        <div class="controls">
            <div class="length-header" id="length-container">
                <span id="length-label">Length</span>
                <input type="number" id="length-num" min="4" max="128" value="24">
            </div>
            <input type="range" id="length" min="4" max="128" value="24" class="full-slider" id="length-slider">

            <div id="pwd-options" class="options-grid">
                <label><input type="checkbox" id="opt-upper" checked> Uppercase</label>
                <label><input type="checkbox" id="opt-lower" checked> Lowercase</label>
                <label><input type="checkbox" id="opt-nums" checked> Numbers</label>
                <label><input type="checkbox" id="opt-syms" checked> Symbols</label>
                
                <div class="full-width-opt">
                    <label><input type="checkbox" id="opt-ambig"> Avoid Ambiguous Characters</label>
                    <div class="opt-desc">Excludes visually similar letters and numbers (l, I, 1, O, 0)</div>
                </div>
                
                <div class="full-width-opt">
                    <label><input type="checkbox" id="opt-safe"> Terminal / YAML Safe</label>
                    <div class="opt-desc">Restricts pool to (!@#%^*-_=+:./?) to prevent injection or string parsing errors in configuration files and bash scripts.</div>
                </div>

                <input type="text" id="sym-input" class="full-width-input" value="!@#$%^&*()-_=+[]{};:,.<>/?|~">
            </div>

            <div id="pass-options" class="options-grid hidden">
                <label><input type="checkbox" id="opt-pass-caps" checked> Capitalize Words</label>
                <label><input type="checkbox" id="opt-pass-nums"> Insert Numbers</label>
                <label class="full-width-opt">Separator: 
                    <select id="opt-pass-sep" style="margin-left: 10px; padding: 2px;">
                        <option value="-">Hyphen (-)</option>
                        <option value="_">Underscore (_)</option>
                        <option value=".">Period (.)</option>
                        <option value=" ">Space</option>
                    </select>
                </label>
            </div>

            <div id="user-options" class="options-grid hidden">
                <label><input type="checkbox" id="opt-user-nums" checked> Append Numbers</label>
                <label class="full-width-opt">Separator: 
                    <select id="opt-user-sep" style="margin-left: 10px; padding: 2px;">
                        <option value="">None</option>
                        <option value="-">Hyphen (-)</option>
                        <option value="_">Underscore (_)</option>
                        <option value=".">Period (.)</option>
                    </select>
                </label>
            </div>

            <hr>

            <div class="setting-row">
                <label><input type="checkbox" id="opt-paranoid"> <strong>Paranoid Mode</strong><br>
                <small>No saving, clears on blur, hides text</small></label>
            </div>

            <div class="setting-row" style="margin-top: 10px;">
                <label for="clear-time">Auto-Clear:</label>
                <select id="clear-time" style="margin-left: 10px; padding: 2px;">
                    <option value="30000">30 Seconds</option>
                    <option value="60000" selected>60 Seconds</option>
                    <option value="300000">5 Minutes</option>
                </select>
            </div>
        </div>

        <button class="action-btn" id="generate-btn">Generate</button>
        <button class="action-btn" id="copy-btn">Copy</button>
    </div>

    <div id="toast"></div>

    <script src="words.js"></script>
    <script src="app.js"></script>
</body>
</html>
