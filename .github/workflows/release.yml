name: release

on:
  push:
    branches: [main]
    paths:
      - public/version.js
      - scripts/build-release.py
      - scripts/verify-release.py
      - tests/test-release.py
      - tests/test-verify-release.py
      - .github/workflows/release.yml
  workflow_dispatch:

# CI only validates and packages; publication is an owner-only local command.
permissions:
  contents: read

concurrency:
  group: release-artifacts-main
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'jakubgt/homelab-vault-gen'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a current protected main branch event
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF_PROTECTED" = true
          case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/branches/main" \
            | jq --exit-status --arg sha "$GITHUB_SHA" '.protected == true and .commit.sha == $sha'

  validate:
    needs: gate
    uses: ./.github/workflows/tests.yml

  build:
    needs: [gate, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and verify release artifacts without publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          python3 scripts/build-release.py --version "$version" --commit "$GITHUB_SHA" --output dist
          python3 -I scripts/verify-release.py --directory dist --version "$version" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
