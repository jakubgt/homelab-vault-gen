name: release

on:
  push:
    branches: [main]
    paths: ['version.js']
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/tests.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build versioned offline archive and checksums
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          python3 scripts/build-release.py --version "$version" --commit "$(git rev-parse HEAD)" --output dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          tag="v$version"
          commit=$(git rev-parse HEAD)
          verify_tag() {
            if refs=$(git ls-remote --exit-code origin "refs/tags/$tag" "refs/tags/$tag^{}"); then
              tag_commit=$(printf '%s\n' "$refs" | awk '/\^\{\}$/ { peeled=$1 } !/\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }')
              if [[ "$tag_commit" != "$commit" ]]; then
                echo "Refusing release: $tag points to $tag_commit, expected $commit." >&2
                exit 1
              fi
            else
              status=$?
              # A draft may not have created its tag yet. Other lookup failures
              # must stop publication, rather than be mistaken for an absent tag.
              if [[ "$status" -ne 2 ]]; then exit "$status"; fi
            fi
          }
          verify_tag
          release_info=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft, .target_commitish] | @tsv")
          if [[ -n "$release_info" ]]; then
            if [[ "$release_info" == *$'\n'* ]]; then
              echo "Refusing ambiguous duplicate releases for $tag." >&2
              exit 1
            fi
            IFS=$'\t' read -r release_id is_draft target <<< "$release_info"
            if [[ "$is_draft" != true ]]; then
              echo "Release $tag is already published; leaving it and its assets unchanged." >&2
              exit 1
            fi
            if [[ "$target" != "$commit" ]]; then
              echo "Refusing draft $release_id: target $target is not the exact commit $commit." >&2
              exit 1
            fi
            echo "Resuming matching draft $release_id for $tag."
          else
            gh release create "$tag" --target "$commit" --draft \
              --title "Homelab Vault $tag" --notes-file CHANGELOG.md
          fi
          verify_tag
          gh release upload "$tag" dist/* --clobber
          verify_tag
          gh release edit "$tag" --draft=false --latest
