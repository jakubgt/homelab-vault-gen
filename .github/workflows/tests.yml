name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    needs: [core, browser, deployment]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$DEPLOYMENT_RESULT" = success

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check syntax and core behavior
        run: |
          node --check public/core.js
          node --check public/app.js
          node --check public/version.js
          npm test
      - name: Verify release packaging
        run: |
          python3 tests/test-release.py
          python3 tests/test-verify-release.py
          python3 tests/test-publish-release.py
          python3 tests/test-repository-security.py
          python3 tests/test-container.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-failure-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check installer and exercise rollback
        run: |
          test -x install-caddy-lxc.sh
          dash -n install-caddy-lxc.sh
          dash -n tests/test-installer.sh
          dash tests/test-installer.sh
          shellcheck install-caddy-lxc.sh
      - name: Start hardened container and verify delivery
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 90
          curl --fail --silent --show-error --dump-header /tmp/vault-headers http://127.0.0.1:8080/ --output /tmp/vault-index
          grep -qi "content-security-policy:.*default-src 'none'" /tmp/vault-headers
          grep -qi 'cache-control:.*no-store' /tmp/vault-headers
          grep -qi 'x-frame-options: DENY' /tmp/vault-headers
          curl --fail --silent --show-error --head http://127.0.0.1:8080/manifest.webmanifest | grep -qi 'content-type: application/manifest+json'
          for asset in core.js app.js version.js words.js qrcode.min.js styles.css LICENSE THIRD_PARTY_NOTICES.md manifest.webmanifest assets/vault-icon.png assets/icon-192.png assets/icon-512.png; do
            curl --fail --silent --show-error "http://127.0.0.1:8080/$asset" --output /dev/null
          done
          for private_file in install-caddy-lxc.sh docker-compose.yml package.json tests/repository.cjs tests/core.cjs tests/browser.spec.js deploy/nginx.conf deploy/Caddyfile public/index.html; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8080/$private_file")" = 404
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/.git/config)" = 403
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q vault-gen)")" = healthy
      - name: Build packaged image and verify its runtime allowlist
        env:
          VAULT_COMMIT: ${{ github.sha }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          test ! -e public/ci-context-probe.txt
          printf 'This unlisted file must stay outside the image.\n' > public/ci-context-probe.txt
          trap 'rm -f public/ci-context-probe.txt' EXIT
          docker build -f deploy/Dockerfile --build-arg "VAULT_VERSION=$version" --build-arg "VAULT_COMMIT=$VAULT_COMMIT" -t homelab-vault-ci .
          docker run -d --name vault-image-ci --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=16m -p 127.0.0.1:8081:8080 homelab-vault-ci
          image_ready=0
          for readiness_attempt in {1..45}; do
            image_state="$(docker inspect --format '{{.State.Status}}/{{.State.Health.Status}}' vault-image-ci)"
            case "$image_state" in
              running/healthy) image_ready=1; break ;;
              */unhealthy|exited/*|dead/*)
                echo "Packaged image failed its startup check: $image_state" >&2
                exit 1
                ;;
            esac
            sleep 2
          done
          if [ "$image_ready" -ne 1 ]; then
            echo "Packaged image did not become healthy within 90 seconds: $image_state" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused --dump-header /tmp/image-headers http://127.0.0.1:8081/ --output /tmp/image-index
          grep -qi "content-security-policy:.*connect-src 'none'" /tmp/image-headers
          grep -qi "content-security-policy:.*manifest-src 'self'" /tmp/image-headers
          grep -qi 'cache-control:.*no-store' /tmp/image-headers
          curl --fail --silent --show-error --head http://127.0.0.1:8081/manifest.webmanifest | grep -qi 'content-type: application/manifest+json'
          for asset in core.js app.js words.js qrcode.min.js styles.css LICENSE THIRD_PARTY_NOTICES.md manifest.webmanifest assets/vault-icon.png assets/icon-192.png assets/icon-512.png; do
            curl --fail --silent --show-error "http://127.0.0.1:8081/$asset" --output /dev/null
          done
          curl --fail --silent --show-error http://127.0.0.1:8081/version.js | grep -F "$VAULT_COMMIT"
          for private_file in install-caddy-lxc.sh docker-compose.yml package.json tests/repository.cjs tests/core.cjs deploy/nginx.conf deploy/Caddyfile deploy/Dockerfile cli/vault.cjs scripts/publish-container.py public/index.html ci-context-probe.txt assets/Preview.png; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8081/$private_file")" = 404
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/.git/config)" = 403
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs
          docker compose down
          docker logs vault-image-ci || true
          docker rm -f vault-image-ci || true
